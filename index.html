<style>
/* Layout: one column, phone first. Sticky header, content, bottom tab bar. Same green-on-paper look as the Chrome extension. */
:root {
  --paper: #f6f8f5; --card: #ffffff; --ink: #17261c; --muted: #5d6b61; --line: #d5ddd6;
  --leaf: #1f5c3a; --leaf-ink: #ffffff; --leaf-soft: #e3efe7; --tomato: #c8321f; --star: #d99a12;
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121a15; --card: #1a251e; --ink: #e8f0ea; --muted: #9bab9f; --line: #2c3a31;
  --leaf: #4fae78; --leaf-ink: #0c1a11; --leaf-soft: #1f3327; --tomato: #ee7a68; --star: #e8b43c; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); padding: 12px 0 8px; border-bottom: 1px solid var(--line); }
h1 { display: flex; align-items: center; gap: 8px; }
h1 .brand { width: 26px; height: 26px; flex: none; }
h1 .logo { height: 28px; width: auto; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 .logo { filter: brightness(2.3); } }
.hrow { display: flex; align-items: center; gap: 10px; }
h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; flex: 1; }
h2 { margin: 18px 0 6px; font-size: 14px; letter-spacing: .02em; }
h3 { margin: 14px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
main { flex: 1; padding: 8px 0 96px; }
ul { list-style: none; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; min-height: 40px; }
.btn.primary { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); font-weight: 600; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.link { background: none; border: 0; color: var(--leaf); padding: 6px 4px; font-weight: 600; }
.link.muted { color: var(--muted); font-weight: 400; }
.link.danger { color: var(--tomato); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-height: 40px; }
input[type=checkbox] { accent-color: var(--leaf); width: 22px; height: 22px; flex: none; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.seg { display: flex; gap: 4px; margin: 8px 0 0; }
.seg button { flex: 1; padding: 8px 0; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; min-height: 38px; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg.meal button[aria-selected="true"] { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 30px; }
.chip[aria-pressed="true"] { background: var(--leaf-soft); color: var(--leaf); border-color: var(--leaf); font-weight: 600; }
.tools { display: flex; gap: 8px; margin: 8px 0 0; }
.tools select { width: auto; flex: none; }

.recipes > li { border-bottom: 1px solid var(--line); padding: 6px 0; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.rrow .grow { flex: 1; min-width: 0; }
.rname { font-weight: 600; overflow-wrap: anywhere; }
.rmeta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.dt { color: var(--leaf); }
.star { border: 0; background: none; padding: 6px; color: var(--muted); line-height: 0; }
.star svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.stepper button { border: 0; background: none; width: 34px; height: 34px; font-size: 18px; }
.stepper span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.on > .rrow .rname { color: var(--leaf); }
.rextra { padding: 0 0 8px 32px; }
.rextra .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
.rextra select { width: auto; min-height: 34px; padding: 4px 8px; }
.ings li { flex-wrap: wrap; display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ings li.off .iname { text-decoration: line-through; color: var(--muted); }
.ings .iname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ings .iqty { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); margin-left: 6px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* shop */
.prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.prog i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .2s; }
.shop-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.aisle { margin-top: 14px; }
.aisle h3 { margin: 0 0 2px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); min-height: 54px; }
.item label { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 54px; cursor: pointer; min-width: 0; }
.item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .nm small { display: block; color: var(--muted); font-size: 12.5px; }
.item .ct { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.item.done .nm { text-decoration: line-through; color: var(--muted); }
.item.done .nm small { text-decoration: none; }
.item .x { border: 0; background: none; color: var(--muted); padding: 10px; font-size: 13px; }
.addrow { display: flex; gap: 8px; margin: 10px 0 0; }
.addrow button { flex: none; }

/* planner */
.pl-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
.pl-head h2 { margin: 0; }
.pl-head button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 40px; height: 40px; font-size: 20px; }
.day { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 8px 12px; margin: 0 0 8px; }
.day.today { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.day h4 { margin: 0 0 2px; display: flex; justify-content: space-between; font-size: 14px; }
.day h4 small { font-weight: 400; color: var(--muted); }
.day li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.day li .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.day .add { width: 100%; text-align: left; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 8px 10px; color: var(--muted); min-height: 38px; margin-top: 4px; }

/* essentials / lists */
.crow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crow .grow { flex: 1; min-width: 0; }
.crow input[type=text] { margin-top: 4px; min-height: 34px; padding: 5px 8px; font-size: 14px; }
.hidex { flex: none; border: 0; background: none; color: var(--muted); font-size: 16px; padding: 6px 8px; cursor: pointer; min-width: 36px; min-height: 36px; }
.collh { cursor: pointer; user-select: none; }
.collh::before { content: "▾"; display: inline-block; width: 14px; font-size: 11px; color: var(--muted); }
.collh[data-open="false"]::before { content: "▸"; }
details.multi { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
details.multi > summary { cursor: pointer; padding: 7px 10px; font-size: 14px; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.multi > summary::after { content: " ▾"; color: var(--muted); } details.multi[open] > summary::after { content: " ▴"; }
details.multi { position: relative; }
.multi-panel { position: absolute; left: 0; top: 100%; z-index: 15; width: min(280px, calc(100vw - 48px)); display: flex; flex-direction: column; gap: 2px; padding: 6px 12px 8px; margin-top: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-height: 260px; overflow: auto; }
.multi-panel label { display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 4px 0; font-size: 14px; text-align: left; cursor: pointer; }
.multi-panel label span { flex: 1; min-width: 0; text-align: left; }
.multi-panel label input[type=checkbox] { flex: none; width: 20px; height: 20px; margin: 0; }

<script>
const RECIPES = [{"id":"cheesy-tomato-pasta","name":"Cheesy tomato pasta","tier":"easy","mins":20,"servings":2,"ingredients":[{"name":"penne pasta","query":"penne pasta 500g","qty":150,"unit":"g","pack":500},{"name":"passata","query":"passata 500g","qty":250,"unit":"g","pack":500},{"name":"mozzarella","query":"mozzarella ball","qty":1,"unit":"pack","pack":1},{"name":"garlic","query":"garlic bulb","qty":1,"unit":"bulb","pack":1}],"meal":"dinner","method":["Boil the penne in salted water until just tender, about 10 minutes.","Meanwhile, soften crushed garlic in a little oil in a pan for 1 minute, then add the passata and simmer for 8 minutes. Season.","Drain the pasta and stir it into the sauce.","Tear the mozzarella over the top and stir until it melts. Serve straight away."]},{"id":"chicken-fajitas","name":"Chicken fajita wraps","tier":"easy","mins":25,"servings":4,"ingredients":[{"name":"chicken breast","query":"chicken breast fillets","qty":500,"unit":"g","pack":650},{"name":"fajita seasoning","query":"fajita seasoning mix","qty":1,"unit":"sachet","pack":1},{"name":"peppers","query":"mixed peppers 3 pack","qty":1,"unit":"pack","pack":1},{"name":"tortilla wraps","query":"tortilla wraps 8 pack","qty":8,"unit":"wraps","pack":8},{"name":"soured cream","query":"soured cream","qty":1,"unit":"pot","pack":1}],"meal":"dinner","method":["Slice the chicken and the peppers into strips.","Fry the chicken in a hot oiled pan for 6 to 7 minutes until golden and cooked through. Stir in the fajita seasoning for the last minute.","Add the peppers and cook for 4 minutes until softened.","Warm the wraps in a dry pan or the microwave.","Fill the wraps with the chicken mix and top with soured cream."]},{"id":"chilli-con-carne","name":"Chilli con carne","tier":"medium","mins":60,"servings":4,"ingredients":[{"name":"beef mince","query":"beef mince 500g","qty":500,"unit":"g","pack":500},{"name":"onions","query":"brown onions","qty":2,"unit":"onions","pack":3},{"name":"chopped tomatoes","query":"chopped tomatoes 400g","qty":2,"unit":"tins","pack":1},{"name":"kidney beans","query":"red kidney beans tin","qty":1,"unit":"tin","pack":1},{"name":"chilli seasoning","query":"chilli con carne seasoning","qty":1,"unit":"sachet","pack":1},{"name":"long grain rice","query":"long grain rice 1kg","qty":300,"unit":"g","pack":1000}],"meal":"dinner","method":["Soften the chopped onions in oil for 5 minutes.","Add the mince and brown it, breaking up the lumps, for 6 to 8 minutes.","Stir in the chilli seasoning, chopped tomatoes and drained kidney beans. Simmer gently for 30 to 40 minutes, stirring now and then, until thick.","Cook the rice following the packet.","Season the chilli to taste and serve over the rice."]},{"id":"chicken-tikka-masala","name":"Chicken tikka masala","tier":"medium","mins":55,"servings":4,"ingredients":[{"name":"chicken thighs","query":"chicken thigh fillets","qty":600,"unit":"g","pack":600},{"name":"tikka paste","query":"tikka masala curry paste","qty":1,"unit":"jar","pack":1},{"name":"natural yoghurt","query":"natural yoghurt 500g","qty":150,"unit":"g","pack":500},{"name":"coconut milk","query":"coconut milk tin","qty":1,"unit":"tin","pack":1},{"name":"basmati rice","query":"basmati rice 1kg","qty":300,"unit":"g","pack":1000},{"name":"naan bread","query":"naan bread 4 pack","qty":4,"unit":"naan","pack":4}],"meal":"dinner","method":["Cut the chicken thighs into chunks and coat with half the yoghurt and a spoon of the tikka paste. Leave for 10 minutes or longer.","Fry the chicken in a hot pan until browned all over, about 6 minutes.","Add the rest of the tikka paste and cook for 1 minute, then pour in the coconut milk. Simmer for 20 to 25 minutes until the chicken is tender and the sauce is thick.","Cook the basmati rice following the packet and warm the naan.","Stir the remaining yoghurt through the curry and serve with the rice and naan."]},{"id":"mushroom-risotto","name":"Wild mushroom risotto","tier":"hard","mins":50,"servings":2,"ingredients":[{"name":"arborio rice","query":"arborio risotto rice","qty":200,"unit":"g","pack":500},{"name":"mixed mushrooms","query":"mixed wild mushrooms","qty":250,"unit":"g","pack":250},{"name":"white wine","query":"dry white wine 75cl","qty":1,"unit":"bottle","pack":1},{"name":"parmesan","query":"parmesan block","qty":1,"unit":"pack","pack":1},{"name":"vegetable stock","query":"vegetable stock cubes","qty":1,"unit":"pack","pack":1},{"name":"shallots","query":"shallots","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Warm the vegetable stock in a pan and keep it hot. Finely chop the shallots.","Fry the mushrooms in oil over a high heat until golden, then set aside.","Soften the shallots in a little butter or oil for 3 minutes. Add the arborio rice and stir for 1 minute.","Pour in a splash of white wine and let it cook away. Add the stock a ladleful at a time, stirring, until the rice is creamy and tender, about 20 minutes.","Stir in the mushrooms and plenty of grated parmesan. Rest for 2 minutes and serve."]},{"id":"beef-wellington","name":"Classic Beef Wellington","tier":"hard","mins":150,"servings":4,"ingredients":[{"name":"beef fillet","query":"beef fillet joint","qty":1,"unit":"joint","pack":1},{"name":"puff pastry","query":"ready rolled puff pastry","qty":1,"unit":"sheet","pack":1},{"name":"chestnut mushrooms","query":"chestnut mushrooms 400g","qty":400,"unit":"g","pack":400},{"name":"parma ham","query":"parma ham","qty":1,"unit":"pack","pack":1},{"name":"english mustard","query":"english mustard","qty":1,"unit":"jar","pack":1},{"name":"eggs","query":"free range eggs 6 pack","qty":1,"unit":"egg","pack":6}],"meal":"dinner","method":["Season the beef fillet and sear it in a very hot pan until browned on every side. Brush with English mustard and cool.","Blitz the chestnut mushrooms to a rough paste and cook in a dry pan until all the moisture has gone. Cool completely.","Lay out overlapping slices of parma ham on cling film, spread over the mushroom mixture, place the beef on top and roll up tightly. Chill for 30 minutes.","Unroll the beef onto the puff pastry, wrap it and seal the edges. Brush all over with beaten egg and chill for 15 minutes.","Bake at 200\u00b0C (180\u00b0C fan) for 35 to 40 minutes for medium-rare, until golden. Rest for 10 minutes before slicing."]},{"id":"easy-teriyaki-chicken","name":"Easy Teriyaki Chicken","tier":"easy","mins":25,"servings":4,"ingredients":[{"name":"chicken thigh fillets","query":"boneless chicken thigh fillets","qty":600,"unit":"g","pack":650},{"name":"teriyaki sauce","query":"teriyaki sauce","qty":1,"unit":"pack","pack":1},{"name":"jasmine rice","query":"jasmine rice 1kg","qty":300,"unit":"g","pack":1000},{"name":"tenderstem broccoli","query":"tenderstem broccoli 200g","qty":200,"unit":"g","pack":200},{"name":"spring onions","query":"spring onions","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Cook the jasmine rice following the packet.","Fry the chicken thigh fillets in a hot oiled pan for 5 minutes each side until golden and cooked through.","Add the teriyaki sauce and let it bubble until sticky and glossy, about 2 minutes.","Steam or boil the tenderstem broccoli for 3 to 4 minutes.","Serve the chicken on rice with the broccoli and sliced spring onions."]},{"id":"sheet-pan-gnocchi","name":"Sheet Pan Gnocchi","tier":"easy","mins":30,"servings":4,"ingredients":[{"name":"gnocchi","query":"potato gnocchi 500g","qty":500,"unit":"g","pack":500},{"name":"cherry tomatoes","query":"cherry tomatoes 250g","qty":250,"unit":"g","pack":250},{"name":"courgettes","query":"courgettes","qty":2,"unit":"each","pack":2},{"name":"red onion","query":"red onions","qty":1,"unit":"each","pack":3},{"name":"mozzarella","query":"mozzarella ball","qty":1,"unit":"pack","pack":1}],"meal":"dinner","method":["Heat the oven to 220\u00b0C (200\u00b0C fan).","Tip the gnocchi, halved cherry tomatoes, chopped courgettes and sliced red onion onto a large tray. Toss with oil, salt and pepper.","R function leftovers() {
  const m = new Map();
  for (const it of buildItems()) {
    if (skipped.has(it.key) || it.extra || it.ess) continue;
    const left = it.count * it.pack - it.need;
    const worth = it.unit === "g" || it.unit === "ml" ? left >= it.pack * 0.25 - 1e-9 : it.pack > 1 && left >= 1 - 1e-9;
    if (worth) m.set(it.key, { ...it, left });
  }
  return m;
}
function suggestions() {
  const lo = leftovers(); if (!lo.size) return { lo, list: [] };
  const list = [];
  for (const r of all()) {
    if (selected.has(r.id)) continue;
    if (tabOf(r) !== ui.meal) continue;                 // follows the Breakfast-Lunch / Dinner / Desserts row
    if (!passes(r)) continue;
    let best = null;
    for (let sv = r.servings; sv >= Math.max(1, Math.ceil(r.servings / 2)); sv--) {
      const scale = sv / r.servings, used = [], extraI = [], taken = new Set();
      for (const ing of r.ingredients) {
        let l = lo.get(ingKey(ing)), swap = false;
        if (!(l && l.left >= ing.qty * scale - 1e-9)) {
          const fam = famOf(ing);
          l = fam ? [...lo.values()].find((x) => !taken.has(x.key) && famOf(x) === fam && x.unit === ing.unit && x.left >= ing.qty * scale - 1e-9) : null;
          swap = !!l;
        }
        if (l) { taken.add(l.key); used.push({ ing, l, swap }); }
        else if (!skipped.has(ingKey(ing)) && !inPantry(ing)) extraI.push(ing);
      }
      if (!used.length) continue;
      const score = used.length / (used.length + extraI.length);
      if (!best || score > best.score + 1e-9) best = { r, used, extra: extraI, score, servings: sv };
    }
    if (best) list.push(best);
  }
  list.sort((a, b) => b.score - a.score || a.extra.length - b.extra.length || b.used.length - a.used.length || a.r.name.localeCompare(b.r.name));
  return { lo, list };
}

// Make a heading fold the content that follows it (until the next heading of the same kind).
function collapsify(main, tag, key) {
  let body = null;
  for (const k of [...main.children]) {
    if (k.tagName === tag) {
      const id = key + k.textContent.trim(); const open = !collapsedSecs.has(id);
      const mine = body = el("div", "secbody"); mine.hidden = !open; k.classList.add("collh"); k.dataset.open = String(open); k.tabIndex = 0; k.setAttribute("role", "button"); k.setAttribute("aria-expanded", String(open));
      const flip = () => { collapsedSecs.has(id) ? collapsedSecs.delete(id) : collapsedSecs.add(id); mine.hidden = collapsedSecs.has(id); k.dataset.open = String(!mine.hidden); k.setAttribute("aria-expanded", String(!mine.hidden)); };
      k.addEventListener("click", flip); k.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); flip(); } });
      k.after(mine);
    } else if (k.classList.contains("nocollapse")) body = null;
    else if (body) body.append(k);
  }
}
